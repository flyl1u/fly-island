[package]
name = "doubao"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
fly-island-plugin-sdk = { path = "../sdk" }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
windows = { version = "0.61", features = ["Win32_UI_Shell"] }