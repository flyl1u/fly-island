[package]
name = "eye-care"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Host-themed multi-monitor eye rest reminders for fly-island"

[dependencies]
fly-island-plugin-sdk = { path = "../sdk" }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
