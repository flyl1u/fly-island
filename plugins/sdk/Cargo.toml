[package]
name = "fly-island-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
