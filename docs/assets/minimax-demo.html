<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniMax Code · 小岛演示</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { min-height: 100vh; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(120% 90% at 50% 0%, #1b2430 0%, #0d1015 55%, #08090c 100%);
    color: #e8eef8;
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  .lead { text-align: center; opacity: .75; font-size: 13px; letter-spacing: .02em; }
  .lead strong { color: #6ec8ff; font-weight: 600; }

  /* 收起的小岛：一条，鼠标移上去展开成 Agent 页 */
  .island {
    width: 560px; height: 44px;
    overflow: hidden;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(38,44,56,.96), rgba(24,28,36,.96));
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    transition: height .3s cubic-bezier(.22,.61,.36,1), box-shadow .3s;
    cursor: default;
  }
  .island:hover {
    height: 296px;
    box-shadow: 0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(110,200,255,.16), inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* 收起态那一行 */
  .bar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; }
  .pulse {
    width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%;
    background: #35d07f; box-shadow: 0 0 14px rgba(53,208,127,.75);
  }
  .bar__text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .bar__brand { opacity: .8; }
  .bar__sep { opacity: .45; }
  .bar__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wave { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; opacity: .55; }
  .wave i { width: 2px; border-radius: 1px; background: currentColor; animation: wave 1.1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s; }
  .wave i:nth-child(3) { animation-delay: .3s; }
  .wave i:nth-child(4) { animation-delay: .45s; }
  @keyframes wave { 0%,100% { height: 4px; } 50% { height: 12px; } }
  .count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: rgba(15,158,240,.18); color: #6ec8ff; font-size: 11px; font-weight: 600;
  }

  /* 展开后的内容 */
  .panel {
    padding: 6px 18px 18px;
    opacity: 0; transform: translateY(-8px);
    transition: opacity .22s .04s, transform .22s .04s;
  }
  .island:hover .panel { opacity: 1; transform: none; }
  .tabs { display: flex; align-items: center; gap: 18px; color: #8b93a3; padding: 8px 0 14px; }
  .tabs svg { width: 17px; height: 17px; }
  .tabs .on { color: #6ec8ff; }
  .tabs__end { margin-left: auto; display: flex; gap: 12px; }

  .quota { display: flex; align-items: center; gap: 10px; padding: 2px 0 14px; }
  .quota__ring { width: 42px; height: 42px; flex: 0 0 auto; }
  .quota__ring circle { fill: none; stroke-linecap: round; }
  .ring-track { stroke: rgba(255,255,255,.08); stroke-width: 4; }
  .ring-outer { stroke: #0f9ef0; stroke-width: 4; transition: stroke-dashoffset .8s ease; }
  .ring-inner { stroke: #47b2f1; stroke-width: 3; }
  .quota__value { font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: .01em; }
  .quota__legend { font-size: 11px; opacity: .55; }

  .sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 10px;
    transition: background .18s;
  }
  .row:hover { background: rgba(255,255,255,.045); }
  .row__dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: #4b5566; }
  .row--running .row__dot { background: #35d07f; box-shadow: 0 0 10px rgba(53,208,127,.8); }

<script>
  // 额度环在展开时再画满，收起时归零：每次悬停都能看到它涨上去。
  const island = document.querySelector(".island");
  const outer = document.querySelector(".ring-outer");
  const inner = document.querySelector(".ring-inner");
  const OUTER = 125.66, INNER = 87.96;
  const set = (on) => {
    outer.style.strokeDashoffset = on ? String(OUTER * (1 - 0.91)) : String(OUTER);
    inner.style.strokeDashoffset = on ? String(INNER * (1 - 1)) : String(INNER);
  };
  set(false);
  island.addEventListener("pointerenter", () => set(true));
  island.addEventListener("pointerleave", () => set(false));
</script>
