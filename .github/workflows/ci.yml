name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests only need their newest push checked. Every commit on main gets its own run that
# is never cancelled, so a failure is pinned to the commit that caused it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, lint, file size, unit tests
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      # 自带 Vite，用 runner 上预装的 Chrome 跑 tests/regression/ 下的全部回归页。
      - name: Browser regression pages
        run: pnpm test:regression

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 结构重构后 clippy 为 0 告警（AGENTS.md），新告警直接让检查失败。
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
