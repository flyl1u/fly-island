<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>消息来源导航与邮件阅读验证</title>
    <style>
    /* As in src/styles/base.css, which this page does not load; layouts depend on it. */
    * { box-sizing: border-box; }
      body { background: #e8e9ed !important; }
      #fixture { display:flex; justify-content:center; padding:44px 24px; }
      .message-fixture { display:flex; flex-direction:column; gap:14px; width:560px; max-width:100%; padding:18px 20px 20px; background:#101013; border-radius:24px; box-shadow:0 16px 40px #0002; transition:height 180ms ease; }
      .fixture-heading { display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; min-height:34px; font-size:13px; color:#f8f6f0b8; }
      .fixture-heading span { color:#a9e6ca; font-size:12px; }
      #results { position:absolute; left:24px; bottom:12px; max-height:140px; overflow:auto; color:#333; font:11px/1.5 Consolas,monospace; white-space:pre-wrap; }
      @media (prefers-reduced-motion: reduce) { .message-fixture { transition:none; } }
    </style>
  </head>
  <body><div id="fixture"></div><pre id="results"></pre><script type="module" src="/tests/mail-reader.tsx"></script></body>
